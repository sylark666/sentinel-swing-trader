name: Sentinel-Swing Hourly Market Scanner

on:
  schedule:
    # Checkpoint 1: 10:15 AM IST (04:45 UTC) Mon-Fri (1h Post-Open Check)
    - cron: '45 4 * * 1-5'
    # Checkpoint 2: 11:15 AM IST (05:45 UTC) Mon-Fri (Mid-Morning Check)
    - cron: '45 5 * * 1-5'
    # Checkpoint 3: 12:15 PM IST (06:45 UTC) Mon-Fri (Noon Check)
    - cron: '45 6 * * 1-5'
    # Checkpoint 4: 01:15 PM IST (07:45 UTC) Mon-Fri (4H Bar Sync Check)
    - cron: '45 7 * * 1-5'
    # Checkpoint 5: 02:15 PM IST (08:45 UTC) Mon-Fri (Mid-Afternoon Check)
    - cron: '45 8 * * 1-5'
    # Checkpoint 6: 03:15 PM IST (09:45 UTC) Mon-Fri (Pre-Close 15m Assessment)
    - cron: '45 9 * * 1-5'
    # Checkpoint 7: 05:30 PM IST (12:00 UTC) Mon-Fri (Post-Market Close Settlement & CSV Ledger)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  scan_market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Checkpoint Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: |
          python live_market_service.py --now
