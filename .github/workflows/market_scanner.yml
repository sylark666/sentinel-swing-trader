name: Sentinel-Swing Hourly Market Scanner

on:
  schedule:
    # Checkpoint 1: 09:45 AM IST (04:15 UTC) Mon-Fri (Morning Volatility Bypass & Open Status)
    - cron: '15 4 * * 1-5'
    # Checkpoint 2: 10:45 AM IST (05:15 UTC) Mon-Fri (Mid-Morning Check)
    - cron: '15 5 * * 1-5'
    # Checkpoint 3: 11:45 AM IST (06:15 UTC) Mon-Fri (Late Morning Check)
    - cron: '15 6 * * 1-5'
    # Checkpoint 4: 12:45 PM IST (07:15 UTC) Mon-Fri (Mid-Day Check)
    - cron: '15 7 * * 1-5'
    # Checkpoint 5: 01:45 PM IST (08:15 UTC) Mon-Fri (Post-13:15 4H Bar Sync)
    - cron: '15 8 * * 1-5'
    # Checkpoint 6: 02:45 PM IST (09:15 UTC) Mon-Fri (Afternoon Momentum Check)
    - cron: '15 9 * * 1-5'
    # Checkpoint 7: 03:20 PM IST (09:50 UTC) Mon-Fri (Pre-Close 10m Execution Call)
    - cron: '50 9 * * 1-5'
    # Checkpoint 8: 05:30 PM IST (12:00 UTC) Mon-Fri (Post-Market Close Settlement & CSV Ledger)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  scan_market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Checkpoint Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: |
          python live_market_service.py --now
