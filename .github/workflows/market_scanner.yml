name: Sentinel-Swing Daily Market Scanner

on:
  schedule:
    # Checkpoint 1: 09:45 AM IST (04:15 UTC) Mon-Fri (Morning volatility bypass & swing check)
    - cron: '15 4 * * 1-5'
    # Checkpoint 2: 01:25 PM IST (07:55 UTC) Mon-Fri (01:15 4H bar completion + feed delay buffer)
    - cron: '55 7 * * 1-5'
    # Checkpoint 3: 03:20 PM IST (09:50 UTC) Mon-Fri (Pre-market close assessment)
    - cron: '50 9 * * 1-5'
    # Checkpoint 4: 05:00 PM IST (11:30 UTC) Mon-Fri (Post-market close assessment & daily summary)
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

jobs:
  scan_market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Checkpoint Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: |
          python live_market_service.py --now
